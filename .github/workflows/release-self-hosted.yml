name: Release self-hosted Perminister

on:
  push:
    tags:
      - "selfhost-v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build self-hosted image and release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/self-hosted/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zakaihamilton/perminister:${{ github.ref_name }}

      - name: Build offline image archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p release-assets
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --file deploy/self-hosted/Dockerfile \
              --platform "$platform" --load \
              --tag "perminister:${RELEASE_TAG}" .
            docker save "perminister:${RELEASE_TAG}" | gzip -1 \
              > "release-assets/perminister-${RELEASE_TAG}-${platform//\//-}.tar.gz"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: helm package charts/perminister --destination release-assets

      - name: Write checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz *.tgz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.tgz
            release-assets/SHA256SUMS
