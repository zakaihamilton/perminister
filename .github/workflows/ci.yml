name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run health:responsive
      - run: pnpm test
      - run: node scripts/check-stable-form-actions.mjs
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run health --details

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual-regression:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run health:visual
        env:
          RUN_VISUAL_REGRESSION: "1"

  preview-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a reviewed PR preview
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          required='- [x] I reviewed the PR preview at 320, 390, 768, 1024, and 1280 px in both light and dark themes, including headers, controls, padding, and margins.'
          if ! grep -Fq -- "$required" <<< "$PULL_REQUEST_BODY"; then
            echo "::error::Review the PR preview at all five widths in both themes, then check the preview review box in the PR description."
            exit 1
          fi
