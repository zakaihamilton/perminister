name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          set -eu
          test -n "$RAILWAY_TOKEN" || { echo "Missing GitHub secret RAILWAY_TOKEN" >&2; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "Missing GitHub variable RAILWAY_PROJECT_ID" >&2; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT_ID" || { echo "Missing GitHub variable RAILWAY_ENVIRONMENT_ID" >&2; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "Missing GitHub variable RAILWAY_SERVICE_ID" >&2; exit 1; }

          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --ci
