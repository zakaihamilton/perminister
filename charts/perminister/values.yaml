replicaCount: 1

image:
  repository: ghcr.io/zakaihamilton/perminister
  tag: selfhost-v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# PostgreSQL permits multiple replicas. Spaces and generic S3-compatible
# storage use JSON object updates and must have exactly one app replica.
storageBackend: postgres
configSecretName: perminister-config
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: perminister.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
